; Minimal ESP32-S3 Switch Pro wired-controller bridge.
; Target: M5StickS3 (ESP32-S3-PICO-1-N8R8, 8MB flash + 8MB PSRAM).
; The HID/descriptor/driver code is from churunfa/SwitchProControllerEsp32S3 (MIT).
; We only keep the HID core; no LittleFS / graph / BLE / OTA.

[platformio]
default_envs = sticks3

[env:sticks3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; S3 native USB-Serial-JTAG is flaky above 115200; skip the baud switch.
upload_speed = 115200
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = default_8MB.csv
; StickS3 N8R8: octal PSRAM + octal flash.
board_build.arduino.memory_type = qio_opi
build_unflags =
    -std=gnu++11
    -std=gnu++14
    -std=gnu++17
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MSC_ON_BOOT=0
    -DARDUINO_USB_DFU_ON_BOOT=0
    -DBOARD_HAS_PSRAM
    -std=gnu++23
lib_deps =
    adafruit/Adafruit TinyUSB Library @ 3.7.3

; M5Stack Cardputer-ADV: ESP32-S3FN8, 8MB flash, no PSRAM.
[env:cardputer]
extends = env:sticks3
board_build.arduino.memory_type = qio_qspi
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MSC_ON_BOOT=0
    -DARDUINO_USB_DFU_ON_BOOT=0
    -std=gnu++23

; M5Stack CoreS3: ESP32-S3-WROOM-1 N16R8, 16MB flash + 8MB PSRAM.
[env:cores3]
extends = env:sticks3
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

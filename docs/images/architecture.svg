<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320">
  <defs>
    <style>
      .bg{fill:#071114}.box{fill:#0e1f23;stroke:#2a4b52;stroke-width:1.5}
      .gold{fill:#d8b46b}.ink{fill:#e9f2ef}.mut{fill:#8da8aa}
      .line{stroke:#d8b46b;stroke-width:1.5;fill:none}
      .label{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
      .mono{font-family:"SF Mono",Menlo,monospace}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d8b46b"/>
    </marker>
  </defs>
  <rect class="bg" width="1000" height="320"/>
  <text x="34" y="44" class="label gold" font-size="11" letter-spacing="3">STICKS3 SWITCH BRIDGE</text>
  <text x="34" y="78" class="label ink" font-size="26" font-weight="600">M5StickS3 → wired Pro Controller</text>

  <rect class="box" x="34" y="130" width="190" height="92" rx="3"/>
  <text x="58" y="164" class="label ink" font-size="16">Mac / PC</text>
  <text x="58" y="188" class="label mut" font-size="11">Python CLI</text>
  <text x="58" y="206" class="label mono mut" font-size="10">tap / hold / sequence</text>

  <rect class="box" x="390" y="130" width="220" height="92" rx="3"/>
  <text x="414" y="164" class="label ink" font-size="16">M5StickS3</text>
  <text x="414" y="188" class="label mut" font-size="11">ESP32-S3 · TinyUSB</text>
  <text x="414" y="206" class="label mono mut" font-size="10">WiFi TCP 8765 → HID</text>

  <rect class="box" x="776" y="130" width="190" height="92" rx="3"/>
  <text x="800" y="164" class="label ink" font-size="16">Switch 2</text>
  <text x="800" y="188" class="label mut" font-size="11">dock USB-A</text>
  <text x="800" y="206" class="label mono mut" font-size="10">057E:2009</text>

  <path class="line" d="M224 176 H382" marker-end="url(#arrow)"/>
  <text x="252" y="162" class="label gold" font-size="10">Wi-Fi</text>
  <path class="line" d="M610 176 H768" marker-end="url(#arrow)"/>
  <text x="638" y="162" class="label gold" font-size="10">USB HID</text>

  <text x="34" y="278" class="label mut" font-size="10">No Raspberry Pi · no Bluetooth Classic · local network only</text>
</svg>
